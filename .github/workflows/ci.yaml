name: ci

on:
  push:
    branches: '**'

  pull_request:

    branches: '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up bun

      uses: oven-sh/setup-bun@v2

    - name: install dependencies
      run: bun install

    - name: run linter
      run: bun run lint

    - name: build
      run: bun run build

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up bun
      uses: oven-sh/setup-bun@v2

    - name: install dependencies

      run: bun run install

    - name: run tests

      run: bun run testCov

    - name: upload testing coverage

      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
